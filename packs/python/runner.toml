tier = "T2"
protocol = "meld-t2/1"
command = "python3"
args = ["-u", "packs/python/worker.py"]
cwd = "project"
stdout = "protocol"
stderr = "forward"

# Runner constraints: the worker may read and write the project tree and has no
# network. Grants can only narrow this set; they cannot add authority.
[sandbox]
network = false
fs = ["project"]

[limits]
max_line_bytes = 1048576
idle_timeout_ms = 30000
