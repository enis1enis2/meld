# JUDGMENT CALL: grammar version is pinned here and in crates/meld-grammars/Cargo.toml.
# Queries are copied from the published crate by tools/sync_grammars.py.
id = "javascript"
aliases = ["js", "node"]
extensions = ["js"]
tier = "T2"
level = "L2"
capabilities = ["stdout", "values"]
grammar_rev = "crate:tree-sitter-javascript@0.25.0"
strict = true

[tree_sitter]
crate = "tree-sitter-javascript"
rev = "0.25.0"

[sandbox]
network = false
fs = ["project"]
