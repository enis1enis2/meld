name: Bug report
description: Report incorrect behavior in the compiler, CLI, LSP, installer, or packs.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. By submitting this issue you agree to follow the [Code of Conduct](https://github.com/enis1enis2/meld/blob/main/CODE_OF_CONDUCT.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release candidate tag, or the full output of `git rev-parse HEAD`.
      placeholder: v0.2.0-rc.3 or 964774e23328c9fa66f584d715936be3cd40d8d9
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Meld is affected?
      options:
        - Splitter or parser
        - Runtime (T2/T3/T5)
        - Value model or bridge
        - LSP, formatter, or REPL
        - Lang Pack, registry, or installer
        - Release artifact or docs
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Rust and Python versions
      description: Output of `rustc --version` and `python3 --version` when relevant.
      placeholder: rustc 1.90.0, Python 3.12.9
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and include the diagnostic output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest `.meld` file, pack, command line, or payload that reproduces the issue.
      placeholder: |
        1. Build with `cargo build --workspace`.
        2. Run `./target/debug/meld run path/to/repro.meld`.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification attempted
      description: List the local gates you ran and whether the issue reproduces on `main`.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
        - label: This report does not contain an unfixed security vulnerability.
          required: true
