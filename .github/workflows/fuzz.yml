name: Fuzz

on:
  push:
    branches: [main, "production/**"]
  pull_request:
  workflow_call:

# Workflow-specific group: github.workflow is the caller's name under
# workflow_call, which would collide with the other Release callers.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: libFuzzer ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [splitter, value_decode, sandbox_manifest, sandbox_policy, t2_envelope]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install nightly for cargo-fuzz
        # JUDGMENT CALL: libFuzzer/cargo-fuzz need nightly, but floats break
        # reproducibility. Pin the date and bump it deliberately.
        run: rustup toolchain install nightly-2026-11-01 --profile minimal
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
          fallback: cargo-install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Create crash artifact directory
        run: mkdir -p fuzz/artifacts
      - name: Run bounded fuzz target
        shell: bash
        run: |
          cd fuzz
          cargo +nightly-2026-11-01 fuzz run "${{ matrix.target }}" -- \
            -max_total_time=60 \
            -max_len=4096 \
            -timeout=5 \
            -artifact_prefix=artifacts/
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  packtool-fuzz:
    name: packtool decoder fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Fuzz packtool parsers
        run: python3 tools/fuzz_packtool.py --iterations 2000
