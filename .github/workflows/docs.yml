name: Docs

on:
  push:
    branches: [main, "production/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: rustdoc and mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: mdbook@0.5.4
          fallback: cargo-install
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Build mdbook
        run: mdbook build docs
      - name: Test mdbook examples
        run: mdbook test docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdbook
          path: docs/book
          if-no-files-found: error

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require immutable markdownlint config
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          # A PR must not weaken the linter config relative to its base branch.
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --exit-code "origin/$BASE_REF" -- .markdownlint.json || {
              echo 'markdownlint config changed in this PR; do not disable rules' >&2
              exit 1
            }
          fi
          git diff --exit-code -- .markdownlint.json
      # .markdownlint.json is supplied by the docs workstream; a missing config
      # intentionally fails this job rather than silently skipping linting.
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          config: .markdownlint.json
          globs: '**/*.md'
