name: Supply-chain audit

on:
  push:
    branches: [main, "production/**"]
  pull_request:
  workflow_call:

# Use a workflow-specific group: github.workflow is the caller's name when this
# file is used via workflow_call, so all Release callers would otherwise share
# one group and cancel each other before running any step.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  audit:
    name: cargo audit, cargo deny and third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.23.0,cargo-deny@0.22.0
          fallback: cargo-install
      - name: Populate Cargo registry metadata
        run: cargo fetch --locked
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --all-features check
      - name: Grammar source pins
        run: python3 tools/check_grammar_sources.py
      - name: Audit exception expiry
        run: python3 tools/check_audit_expiry.py
      - name: Third-party notices are current
        run: python3 tools/generate_third_party_notices.py --check
