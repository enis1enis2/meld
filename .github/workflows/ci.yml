name: CI

on:
  push:
    branches: [main, "production/**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }}, rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.90.0"]
    steps:
      # Action refs are pinned to the same SHAs used by release.yml where that
      # ref exists. dtolnay/rust-toolchain is one generic action; the pinned
      # stable ref resolves both the `stable` and `1.90.0` toolchain inputs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # JUDGMENT CALL 45: floating 3.12 patch avoids runner-image gaps such
          # as 3.12.9 missing on Ubuntu 26.04; requirements-ci.txt still pins
          # the only Python dependency, cryptography 50.0.2.
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      # Populate every locked dependency source, including target-specific
      # crates that clippy/test do not download on this runner. The notices
      # generator reads crate manifests from the registry cache and must not
      # see target-specific dependencies as unresolved license metadata.
      - name: Fetch all locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Clippy (OCI feature)
        if: runner.os == 'Linux'
        run: cargo clippy -p meld-sandbox --features oci --all-targets --locked -- -D warnings
      - name: Test (OCI feature)
        if: runner.os == 'Linux'
        run: cargo test -p meld-sandbox --features oci --all-targets --locked
      - name: Build docs
        run: cargo doc --workspace --no-deps --locked
      - name: Python, grammar, schema and reference gates
        shell: bash
        run: |
          python -m unittest discover -s tools/tests -v
          python tools/fuzz_splitter.py
          python tools/meld_check_ref.py
          python tools/highlight_ref.py
          python tools/check_grammar_sources.py
          python tools/check_schemas.py
      - name: Verify every checked-in pack
        shell: bash
        run: |
          status=0
          for pack in packs/* tests/fixtures/pack-third-party; do
            if [ -f "$pack/pack.toml" ]; then
              python tools/packtool.py verify "$pack" || status=1
            fi
          done
          exit "$status"

  cross-target:
    name: cross-target clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - name: Install cross targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          rustup target add x86_64-pc-windows-msvc
      - name: Clippy macOS ARM
        run: cargo clippy -p meld-sandbox --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - name: Clippy macOS x86
        run: cargo clippy -p meld-sandbox --all-targets --locked --target x86_64-apple-darwin -- -D warnings
      - name: Clippy Windows x86
        run: cargo clippy -p meld-sandbox --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Clippy Windows x86 (OCI feature gated out)
        run: cargo clippy -p meld-sandbox --features oci --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  supply-chain:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # JUDGMENT CALL 46: pin the same tool versions as audit.yml. The floating
      # @cargo-deny branch installed 0.21.0, which still reports unmaintained
      # fxhash as an error; the pinned 0.22.0 honours deny.toml and passes.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.23.0,cargo-deny@0.22.0
          fallback: cargo-install
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --all-features check
