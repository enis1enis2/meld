name: CI

on:
  push:
    branches: [main, "production/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }}, rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.90.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # JUDGMENT CALL 45: floating 3.12 patch avoids runner-image gaps such
          # as 3.12.9 missing on Ubuntu 26.04; requirements-ci.txt still pins
          # the only Python dependency, cryptography 50.0.2.
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy (OCI feature)
        if: runner.os == 'Linux'
        run: cargo clippy -p meld-sandbox --features oci --all-targets -- -D warnings
      - name: Test (OCI feature)
        if: runner.os == 'Linux'
        run: cargo test -p meld-sandbox --features oci --all-targets
      - name: Build docs
        run: cargo doc --workspace --no-deps
      - name: Python unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: Splitter fuzz smoke
        run: python tools/fuzz_splitter.py
      - name: Reference harnesses
        shell: bash
        run: |
          python tools/meld_check_ref.py
          python tools/highlight_ref.py
      - name: Verify every checked-in pack
        shell: bash
        run: |
          status=0
          for pack in packs/* tests/fixtures/pack-third-party; do
            if [ -f "$pack/pack.toml" ]; then
              python tools/packtool.py verify "$pack" || status=1
            fi
          done
          exit "$status"

  cross-target:
    name: cross-target clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install cross targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          rustup target add x86_64-pc-windows-msvc
      - name: Clippy macOS ARM
        run: cargo clippy -p meld-sandbox --all-targets --target aarch64-apple-darwin -- -D warnings
      - name: Clippy macOS x86
        run: cargo clippy -p meld-sandbox --all-targets --target x86_64-apple-darwin -- -D warnings
      - name: Clippy Windows x86
        run: cargo clippy -p meld-sandbox --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Clippy Windows x86 (OCI feature gated out)
        run: cargo clippy -p meld-sandbox --features oci --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  supply-chain:
    name: supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # JUDGMENT CALL 46: pin the same tool versions as audit.yml. The floating
      # @cargo-deny branch installed 0.21.0, which still reports unmaintained
      # fxhash as an error; the pinned 0.22.0 honours deny.toml and passes.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@0e09747a63ae497bf945b3dcaf38fef0050d0109 # v2.62.0
        with:
          tool: cargo-audit@0.23.0,cargo-deny@0.22.0
          fallback: cargo-install
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny
        run: cargo deny --all-features check
