name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
      # GitHub's glob grammar rejects a bare `+` here. Tags carrying build
      # metadata still trigger the workflow but are rejected by the strict
      # stable-SemVer gate in release-gates, so they can never publish.

permissions:
  contents: read

# Serialize every release in the repository, not just one ref: two stable tags
# must never publish or change `latest` concurrently.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MELD_ISSUER: 'https://token.actions.githubusercontent.com'
  MELD_REPOSITORY: 'enis1enis2/meld'

jobs:
  ci:
    name: unified CI gates
    uses: ./.github/workflows/ci.yml

  docs:
    name: docs and markdown gates
    uses: ./.github/workflows/docs.yml

  audit:
    name: audit
    uses: ./.github/workflows/audit.yml

  msrv:
    name: msrv
    uses: ./.github/workflows/msrv.yml

  fuzz:
    name: fuzz
    uses: ./.github/workflows/fuzz.yml

  release-gates:
    name: release tag gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python release-gate dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Require stable SemVer release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import os
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit(f'release tags must be stable vMAJOR.MINOR.PATCH (got: {tag})')
          version = tag[1:]
          with open('Cargo.toml', 'rb') as handle:
              manifest = tomllib.load(handle)
          cargo_version = manifest.get('workspace', {}).get('package', {}).get('version')
          if cargo_version != version:
              raise SystemExit(
                  f'tag {tag} requires Cargo workspace version {version}, found {cargo_version}'
              )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'MELD_VERSION={version}\n')
          print(f'release version verified: {version}')
          PY
      - name: Grammar, schema and pack gates at the release tag
        shell: bash
        run: |
          python3 tools/check_grammar_sources.py
          python3 tools/check_schemas.py --release-ready
          status=0
          for pack in packs/* tests/fixtures/pack-third-party; do
            if [ -f "$pack/pack.toml" ]; then
              python3 tools/packtool.py verify "$pack" \
                --trust-roots packs/registry/trust-roots.toml \
                --require-trusted || status=1
            fi
          done
          exit "$status"
      - name: Verify committed T3 guest digest
        run: python3 tools/check_t3_guest_digest.py --check

  native-matrix:
    name: native build (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM64; macos-15-intel is the current Intel label.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set release variables
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          [ -n "$target" ] || { echo 'could not determine host target' >&2; exit 1; }
          [ "$target" = "$EXPECTED_TARGET" ] || {
            echo "runner ${{ matrix.os }} produced $target, expected $EXPECTED_TARGET" >&2
            exit 1
          }
          echo "MELD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "MELD_TARGET=$target" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git -C . log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build and package twice for reproducibility
        shell: bash
        run: |
          sh scripts/check_reproducibility.sh \
            --version "$MELD_VERSION" \
            --target "$MELD_TARGET" \
            --out dist/repro
      - name: Collect canonical archive and repro proof
        shell: bash
        run: |
          mkdir -p dist/release dist/repro-artifact/package-a dist/repro-artifact/package-b
          cp dist/repro/package-a/* dist/release/
          cp dist/repro/package-a/* dist/repro-artifact/package-a/
          cp dist/repro/package-b/* dist/repro-artifact/package-b/
      - name: Verify archive install layout
        shell: bash
        run: |
          archive=$(find dist/release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)
          [ -n "$archive" ] || { echo 'no release archive found' >&2; exit 1; }
          python3 scripts/extract_release_archive.py "$archive" dist/install-check
          payload=$(find dist/install-check -mindepth 1 -maxdepth 1 -type d | head -n 1)
          [ -n "$payload" ] || { echo 'archive has no payload directory' >&2; exit 1; }
          sh scripts/verify_install.sh \
            --bin-dir "$payload/bin" \
            --share-dir "$payload/share/meld-lang"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.os }}
          path: dist/repro-artifact/*
          if-no-files-found: error

  reproducible:
    name: reproducible packaging
    needs: native-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: dist/repro
      - name: Set expected release targets
        shell: bash
        run: |
          echo "MELD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # There is no standard Linux aarch64 GitHub-hosted runner. Do not
          # claim that target; install.sh fails clearly on aarch64 Linux hosts.
          echo "MELD_EXPECTED_TARGETS=x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc" >> "$GITHUB_ENV"
      - name: Compare every uploaded build pair and assert target coverage
        shell: bash
        run: |
          set -euo pipefail
          pair_count=0
          actual_targets=()
          for a in dist/repro/repro-*/package-a; do
            [ -d "$a" ] || continue
            b=${a%/package-a}/package-b
            sh scripts/check_reproducibility.sh --compare "$a" "$b"
            pair_count=$((pair_count + 1))
            for archive in "$a"/*.tar.gz "$a"/*.zip; do
              [ -f "$archive" ] || continue
              name=${archive##*/}
              target=${name#meld-lang-$MELD_VERSION-}
              target=${target%.tar.gz}
              target=${target%.zip}
              actual_targets+=("$target")
            done
          done
          expected_count=$(printf '%s\n' $MELD_EXPECTED_TARGETS | wc -l | tr -d ' ')
          [ "$pair_count" -eq "$expected_count" ] || {
            echo "expected $expected_count reproducible pairs, got $pair_count" >&2
            exit 1
          }
          [ "${#actual_targets[@]}" -eq "$expected_count" ] || {
            echo "expected $expected_count archive targets, got ${#actual_targets[@]}" >&2
            exit 1
          }
          mapfile -t actual_sorted < <(printf '%s\n' "${actual_targets[@]}" | LC_ALL=C sort -u)
          mapfile -t expected_sorted < <(printf '%s\n' $MELD_EXPECTED_TARGETS | LC_ALL=C sort -u)
          [ "${#actual_sorted[@]}" -eq "$expected_count" ] || {
            echo "duplicate or unexpected targets: ${actual_targets[*]}" >&2
            exit 1
          }
          for i in "${!expected_sorted[@]}"; do
            [ "${actual_sorted[$i]}" = "${expected_sorted[$i]}" ] || {
              echo "expected target set [${expected_sorted[*]}], got [${actual_sorted[*]}]" >&2
              exit 1
            }
          done
          echo "reproducible target set verified: ${actual_sorted[*]}"

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-sbom@0.10.0
          fallback: cargo-install
      - name: Populate Cargo registry metadata
        run: cargo fetch --locked
      - name: Set release variables
        shell: bash
        run: |
          echo "MELD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git -C . log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Generate normalized SBOM
        run: |
          sh scripts/generate_sbom.sh \
            --version "$MELD_VERSION" \
            --out "dist/release/meld-lang-$MELD_VERSION-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/release/*.cdx.json
          if-no-files-found: error

  sign:
    name: sign and verify release artifacts
    needs: [ci, docs, release-gates, audit, msrv, fuzz, native-matrix, reproducible, sbom]
    if: >-
      needs.release-gates.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.3
      - name: Set release variables
        shell: bash
        run: |
          echo "MELD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$(git -C . rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git -C . log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist/release
      - name: Generate manifest, then strict checksums
        shell: bash
        run: |
          python3 scripts/generate_release_manifest.py \
            --version "$MELD_VERSION" \
            --artifacts-dir dist/release \
            --sbom "dist/release/meld-lang-$MELD_VERSION-sbom.cdx.json" \
            --commit "$GIT_COMMIT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --expected-target x86_64-unknown-linux-gnu \
            --expected-target aarch64-apple-darwin \
            --expected-target x86_64-apple-darwin \
            --expected-target x86_64-pc-windows-msvc \
            --out "dist/release/meld-lang-$MELD_VERSION.release-manifest.json"
          sh scripts/generate_checksums.sh \
            --dir dist/release \
            --out dist/release/SHA256SUMS
      - name: Keyless-sign and verify artifacts
        shell: bash
        run: |
          sh scripts/sign_artifacts.sh \
            --dir dist/release \
            --repo "$MELD_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --issuer "$MELD_ISSUER"
      - name: Verify signed release locally in CI
        shell: bash
        run: |
          sh scripts/verify_artifacts.sh \
            --dir dist/release \
            --repo "$MELD_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --issuer "$MELD_ISSUER" \
            --expected-target x86_64-unknown-linux-gnu \
            --expected-target aarch64-apple-darwin \
            --expected-target x86_64-apple-darwin \
            --expected-target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: dist/release/*
          if-no-files-found: error

  provenance:
    name: GitHub build provenance
    needs: sign
    if: >-
      needs.sign.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: dist/release
      # An attestation is not a certification. This workflow does not claim
      # SLSA Level 3 or any other SLSA level.
      - name: Attest core release files
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS
            dist/release/*.cdx.json
            dist/release/*release-manifest*.json
      - name: Collect attestation bundle
        shell: bash
        run: |
          bundle="${{ steps.attest.outputs.bundle-path }}"
          [ -n "$bundle" ] && [ -f "$bundle" ] || {
            echo 'provenance action did not produce a bundle' >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          cp "$bundle" "dist/release/meld-lang-$version.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-with-provenance
          path: dist/release/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [ci, docs, release-gates, audit, msrv, fuzz, native-matrix, reproducible, sbom, sign, provenance]
    if: >-
      needs.release-gates.result == 'success' &&
      needs.provenance.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') && !contains(github.ref_name, '+')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-with-provenance
          path: dist/release
      - name: Re-verify downloaded release before publishing
        shell: bash
        run: |
          sh scripts/verify_artifacts.sh \
            --dir dist/release \
            --repo "$MELD_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --issuer "$MELD_ISSUER" \
            --attestation "dist/release/meld-lang-${GITHUB_REF_NAME#v}.intoto.jsonl" \
            --require-attestation \
            --expected-target x86_64-unknown-linux-gnu \
            --expected-target aarch64-apple-darwin \
            --expected-target x86_64-apple-darwin \
            --expected-target x86_64-pc-windows-msvc
      - name: Verify channel metadata readiness
        shell: bash
        run: |
          python3 tools/generate_channel_metadata.py \
            --dist-dir dist/release \
            --version "${GITHUB_REF_NAME#v}" \
            --check
      - name: Extract exact changelog section
        shell: bash
        run: |
          python3 scripts/extract_changelog_section.py \
            --version "${GITHUB_REF_NAME#v}" \
            --input CHANGELOG.md \
            --output release-notes.md
      - name: Publish release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          mapfile -t assets < <(find dist/release -maxdepth 1 -type f | LC_ALL=C sort)
          [ "${#assets[@]}" -gt 0 ] || { echo 'no release assets found' >&2; exit 1; }

          # `latest` follows the newest stable tag, not the order in which
          # workflows happen to be re-run. This prevents an older re-run from
          # demoting a newer release.
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -Ev -- '[-+]' | LC_ALL=C sort -V | tail -n 1)
          [ -n "$latest_tag" ] || { echo 'could not determine latest stable tag' >&2; exit 1; }
          if [ "$latest_tag" = "$tag" ]; then
            expect_latest=yes
            latest_flag=(--latest)
          else
            expect_latest=no
            latest_flag=(--latest=false)
          fi

          asset_args=()
          for asset in "${assets[@]}"; do
            asset_args+=(--asset "${asset##*/}")
          done

          if gh release view "$tag" --json isLatest,isPrerelease,body,assets > release-state.json 2> release-view.err; then
            python3 scripts/check_release_state.py \
              --state release-state.json \
              --notes release-notes.md \
              --expect-latest "$expect_latest" \
              "${asset_args[@]}" > missing-assets.txt
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release upload "$tag" "dist/release/$asset" --clobber
            done < missing-assets.txt
            echo "release $tag already published; notes, latest flag and assets verified"
          else
            if grep -Eqi 'not found|could not resolve' release-view.err; then
              gh release create "$tag" "${assets[@]}" \
                --verify-tag \
                "${latest_flag[@]}" \
                --title "Meld $version" \
                --notes-file release-notes.md
            else
              cat release-view.err >&2
              exit 1
            fi
          fi
