# JUDGMENT CALL: cargo-deny is gated in CI so license, source and advisory
# policy is enforced on every change. The allow list is explicit; adding a new
# dependency license requires a reviewed change to this file.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.8
# Keep this allow list identical to `accepted` in about.toml: cargo-deny and
# the third-party notices generator must enforce the same license policy.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are private, so extensionless path dependencies are a
# deliberate local build pattern rather than a published wildcard requirement.
# Public registry wildcard versions remain denied by `wildcards = "deny"`.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
