[package]
name = "meld-grammars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
meld-core = { path = "../meld-core" }
tree-sitter = "=0.27.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-json = "=0.24.8"
# JUDGMENT CALL: tree-sitter-markdown 0.7.1 still targets tree-sitter 0.19,
# which is ABI-incompatible with the core's 0.27. tree-sitter-md 0.5.4 ships
# the same upstream Markdown grammar with 0.27 bindings.
tree-sitter-md = "=0.5.4"
# JUDGMENT CALL: tree-sitter-sql 0.0.2 also targets tree-sitter 0.19.
# tree-sitter-sequel 0.3.13 is the maintained SQL grammar with a
# tree-sitter-language LanguageFn that converts to 0.27.
tree-sitter-sequel = "=0.3.13"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-lua = "=0.5.0"
# JUDGMENT CALL: the language-expansion batch stays on the same 0.27 ABI as
# the core. Each version below is an exact crates.io pin verified on
# 2026-11-20; the matching pack.toml files carry the same pins.
tree-sitter-typescript = "=0.23.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.25.2"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-c-sharp = "=0.24.0"
tree-sitter-haskell = "=0.24.1"
tree-sitter-ocaml = "=0.26.0"
tree-sitter-scala = "=0.26.13"
tree-sitter-zig = "=1.1.2"
tree-sitter-r = "=1.3.0"
# JUDGMENT CALL: tree-sitter-perl 1.1.2 keeps tree-sitter 0.26 as a *normal*
# dependency, so Cargo rejects it alongside the core's 0.27 `links` library.
# The Perl pack is deferred until a 0.27-compatible grammar is published.
tree-sitter-dart = "=0.3.0"
tree-sitter-solidity = "=1.2.13"
