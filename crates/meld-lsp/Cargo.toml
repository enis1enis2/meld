[package]
name = "meld-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "meld_lsp"
path = "src/lib.rs"

[[bin]]
name = "meld-lsp"
path = "src/main.rs"

[dependencies]
meld-core = { path = "../meld-core" }
meld-grammars = { path = "../meld-grammars" }
tower-lsp-server = "0.23.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2"
