[package]
name = "meld-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deny-by-default OS sandbox policy model and backends for Meld"

publish = false

[dependencies]
toml = "1.0"
thiserror = "1"
serde_json = { version = "1.0.154", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[features]
default = []
# Optional OCI/runc fallback. Never enabled by default: it needs a runtime
# installed on the host and is only used when the platform backend cannot
# enforce the declared policy itself.
oci = ["dep:oci-spec", "dep:serde_json"]

[dependencies.oci-spec]
version = "0.10"
default-features = false
features = ["runtime"]
optional = true
