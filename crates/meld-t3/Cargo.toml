[package]
name = "meld-t3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
meld-core = { path = "../meld-core" }
meld-sandbox = { path = "../meld-sandbox" }
meld-value = { path = "../meld-value" }
sha2 = "=0.11.1"
# JUDGMENT CALL: wasmtime 36.0.23 is the last Component Model runtime line that
# supports the workspace MSRV (Rust 1.90). Pin it exactly so a dependency bump
# cannot silently raise the MSRV or change trap semantics. The compiled demo
# component is committed, so tests need no wasm toolchain.
wasmtime = { version = "=36.0.23", features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
    "pooling-allocator",
] }
serde_json = "1.0.154"

[dev-dependencies]
meld-t2 = { path = "../meld-t2" }
