[workspace]
members = [
    "crates/meld-core",
    "crates/meld-value",
    "crates/meld-t2",
    "crates/meld-sandbox",
    "crates/meld-cli",
    "crates/meld-grammars",
    "crates/meld-t3",
    "crates/meld-lsp",
    "crates/meld-lib",
    "crates/meld-installer",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

# Local `cargo build` stays fast and unoptimized. Use `cargo rbuild` (or
# `cargo build --release`) for the same optimized profile the release
# workflow ships; `rbuild` is defined in .cargo/config.toml.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
