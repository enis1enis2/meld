[package]
name = "meld-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.154"
meld-core = { path = "../crates/meld-core" }
meld-value = { path = "../crates/meld-value" }
meld-sandbox = { path = "../crates/meld-sandbox" }
meld-t2 = { path = "../crates/meld-t2" }

[[bin]]
name = "splitter"
path = "fuzz_targets/splitter.rs"
test = false
doc = false

[[bin]]
name = "value_decode"
path = "fuzz_targets/value_decode.rs"
test = false
doc = false

[[bin]]
name = "sandbox_manifest"
path = "fuzz_targets/sandbox_manifest.rs"
test = false
doc = false

[[bin]]
name = "sandbox_policy"
path = "fuzz_targets/sandbox_policy.rs"
test = false
doc = false

[[bin]]
name = "t2_envelope"
path = "fuzz_targets/t2_envelope.rs"
test = false
doc = false

# Deliberately a separate workspace: the main Cargo.lock and normal workspace
# builds are unaffected. Run with `cargo fuzz run <target>` from this directory.
[workspace]
